<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nastipics – Links</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Mono', monospace;
      background-color: #F2E1CF;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 3px solid #2c2c2c;
      background: #e0d0b8;
      display: block;
    }

    h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .bio {
      font-size: 0.95rem;
      margin-bottom: 36px;
      color: #444;
      max-width: 320px;
      margin-left: auto;
      margin-right: auto;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    a.button {
      display: block;
      background: #ffffff;
      color: #2c2c2c;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      border: 2px solid #2c2c2c;
      transition: all 0.2s ease;
      box-shadow: 3px 3px 0 #2c2c2c;
    }

    a.button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 #2c2c2c;
      background: #fff9f0;
    }

    a.button:active {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 #2c2c2c;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Replace the src with your actual profile picture URL or filename -->
    <img src="images/PROFILE.jpeg" alt="Profile picture" class="avatar">

    <h1>Nastipics</h1>
    
    <p class="bio">
      Creative artist • Illustrations, pen & pencil drawings<br>
      Support my work below ✨
    </p>

    <div class="links">
      <a href="https://www.tiktok.com/nastipics" class="button" target="_blank" rel="noopener">
       My Only TikTok
      </a>

      <a href="https://x.com/Nastipics" class="button" target="_blank" rel="noopener">
        My Only X
      </a>

      <a href="https://www.patreon.com/c/Nastipics" class="button" target="_blank" rel="noopener">
        My Patreon
      </a>
    </div>

    <div class="footer">
      Thanks for the support ♡
    </div>
  </div>
</body>
</html>
